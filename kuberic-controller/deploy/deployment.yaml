apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberic-controller
  namespace: kuberic-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberic-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberic-controller
    spec:
      serviceAccountName: kuberic-controller
      containers:
        - name: controller
          image: ghcr.io/youyuanwu/kuberic-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KUBERIC_AGENT_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberic-agent-credentials
                  key: bearer-token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
