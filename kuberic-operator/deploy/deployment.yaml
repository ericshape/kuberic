apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberic-operator
  namespace: xedio
  labels:
    app: kuberic-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuberic-operator
  template:
    metadata:
      labels:
        app: kuberic-operator
    spec:
      serviceAccountName: kuberic-operator
      containers:
      - name: operator
        image: localhost/kuberic-operator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: RUST_LOG
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 10000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
