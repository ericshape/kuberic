name: CI / CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XEDIO_CI: true
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/kuberic-kind-kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: kind-kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
    
    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just
    - uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0

    - uses: actions/cache@v4
      with:
        path: target/downloads
        key: gateway-downloads-${{ hashFiles('scripts/gateway_kind.sh') }}

    - name: Check download caching and shell syntax
      run: |
        for script in scripts/download.sh scripts/download_test.sh scripts/gateway_kind.sh; do
          bash -n "$script"
        done
        bash scripts/download_test.sh

    - name: Install PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql postgresql-client
        # Stop the default PG service (tests manage their own instances)
        sudo systemctl stop postgresql.service || true
        pg_config --version

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Kubernetes KinD Cluster
      uses: helm/kind-action@v1
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}
        config: deploy/kind-config.yaml
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Record and verify isolated KinD ownership
      run: |
        printf '%s\n' \
          "cluster=${KIND_CLUSTER_NAME}" \
          "context=${KUBE_CONTEXT}" \
          "kubeconfig=${KUBECONFIG}" \
          | install -m 600 /dev/stdin "${KUBECONFIG}.kuberic-owner"
        just verify-kind-context

    - name: Build and load Docker images
      run: just images

    - name: Install pinned Gateway API and Envoy Gateway
      run: just gateway-install

    - name: Test kuberic-core
      run: cargo test -p kuberic-core --all-features -- --nocapture

    - name: Test kuberic-dex
      run: cargo test -p kuberic-dex --all-features -- --nocapture

    - name: Test sqlite-commit-barrier
      run: cargo test -p sqlite-commit-barrier --all-features -- --nocapture

    - name: Test kuberic-operator
      run: cargo test -p kuberic-operator --all-features -- --nocapture

    - name: Test kuberic-operator2
      run: cargo test -p kuberic-operator2 --all-features -- --nocapture

    - name: Test KVStore example
      run: cargo test -p kvstore --all-features -- --nocapture

    - name: Test PostgreSQL example
      run: cargo test -p postgres-replicated --all-features -- --nocapture

    - name: Test SQLite example
      run: cargo test -p sqlite-replicated --all-features -- --nocapture

    - name: Test Kubernetes integration
      run: cargo test -p kuberic-tests --all-features -- --nocapture

    - name: Collect Gateway diagnostics
      if: failure()
      timeout-minutes: 4
      run: just gateway-diagnostics > gateway-diagnostics.log 2>&1

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gateway-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: gateway-diagnostics.log
        if-no-files-found: ignore

  publish:
    name: Publish container images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - uses: taiki-e/install-action@cfb6a08e73d810c62150cc379cc3670921bec901 # protoc

    - name: Verify source ref is current
      run: |
        git fetch --force --no-tags origin "$GITHUB_REF"
        test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse 'HEAD^{commit}')"

    - name: Build release binaries
      run: cargo build --locked --release -p kuberic-operator -p kuberic-operator2 -p kvstore

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Generate kuberic-operator image metadata
      id: operator_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kuberic-operator
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Publish kuberic-operator image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: kuberic-operator/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.operator_meta.outputs.tags }}
        labels: ${{ steps.operator_meta.outputs.labels }}

    - name: Generate kuberic-operator2 image metadata
      id: operator2_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kuberic-operator2
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Publish kuberic-operator2 image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: kuberic-operator2/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.operator2_meta.outputs.tags }}
        labels: ${{ steps.operator2_meta.outputs.labels }}

    - name: Generate kvstore image metadata
      id: kvstore_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kvstore
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Publish kvstore image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: examples/kvstore/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.kvstore_meta.outputs.tags }}
        labels: ${{ steps.kvstore_meta.outputs.labels }}
