name: CI / CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  XEDIO_CI: true
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/kuberic-kind-kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: kind-kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
    
    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just
    - uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0

    - uses: actions/cache@v4
      with:
        path: target/downloads
        key: gateway-downloads-${{ hashFiles('scripts/gateway_kind.sh') }}

    - name: Check download caching and shell syntax
      run: |
        for script in scripts/download.sh scripts/download_test.sh scripts/gateway_kind.sh; do
          bash -n "$script"
        done
        bash scripts/download_test.sh

    - name: Install PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql postgresql-client
        # Stop the default PG service (tests manage their own instances)
        sudo systemctl stop postgresql.service || true
        pg_config --version

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Kubernetes KinD Cluster
      uses: helm/kind-action@v1
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}
        config: deploy/kind-config.yaml
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Record and verify isolated KinD ownership
      run: |
        printf '%s\n' \
          "cluster=${KIND_CLUSTER_NAME}" \
          "context=${KUBE_CONTEXT}" \
          "kubeconfig=${KUBECONFIG}" \
          | install -m 600 /dev/stdin "${KUBECONFIG}.kuberic-owner"
        just verify-kind-context

    - name: Build and load Docker images
      run: just images

    - name: Install pinned Gateway API and Envoy Gateway
      run: just gateway-install

    - name: Run workspace tests
      run: cargo test --workspace --all-features -- --nocapture

    - name: Collect Gateway diagnostics
      if: failure()
      timeout-minutes: 4
      run: just gateway-diagnostics > gateway-diagnostics.log 2>&1

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gateway-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: gateway-diagnostics.log
        if-no-files-found: ignore

  publish:
    name: Publish container images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    - name: Read rust version from rust-toolchain.toml
      id: rust-version
      run: echo "version=$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')" >> "$GITHUB_OUTPUT"

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.rust-version.outputs.version }}

    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@protoc

    - name: Build release binaries
      run: cargo build --locked --release -p kuberic-operator -p kuberic-operator2 -p kvstore

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Generate kuberic-operator image metadata
      id: operator_meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kuberic-operator
        flavor: latest=auto
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Publish kuberic-operator image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: kuberic-operator/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.operator_meta.outputs.tags }}
        labels: ${{ steps.operator_meta.outputs.labels }}

    - name: Generate kuberic-operator2 image metadata
      id: operator2_meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kuberic-operator2
        flavor: latest=auto
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Publish kuberic-operator2 image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: kuberic-operator2/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.operator2_meta.outputs.tags }}
        labels: ${{ steps.operator2_meta.outputs.labels }}

    - name: Generate kvstore image metadata
      id: kvstore_meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kvstore
        flavor: latest=auto
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Publish kvstore image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        file: examples/kvstore/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.kvstore_meta.outputs.tags }}
        labels: ${{ steps.kvstore_meta.outputs.labels }}
