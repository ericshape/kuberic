name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XEDIO_CI: true
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER_NAME: kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KUBECONFIG: /tmp/kuberic-kind-kubeconfig-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: kind-kuberic-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: rustfmt, clippy
        build-warnings: ""
    
    - uses: taiki-e/install-action@protoc
    - uses: taiki-e/install-action@just

    - name: Check external dependency tooling
      run: |
        bash -n scripts/gateway_kind.sh
        bash scripts/external_dependencies_test.sh

    - name: Install PostgreSQL
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq postgresql postgresql-client
        # Stop the default PG service (tests manage their own instances)
        sudo systemctl stop postgresql.service || true
        pg_config --version

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    - name: Install Helm
      uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0

    - name: Restore external dependency bundle
      uses: actions/cache@v4
      with:
        path: .kuberic-cache/external
        key: external-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/external-dependencies.json') }}

    - name: Prepare pinned external dependencies
      run: just prepare-external-dependencies

    - name: Kubernetes KinD Cluster
      uses: helm/kind-action@v1
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: ${{ env.KIND_CLUSTER_NAME }}
        config: deploy/kind-config.yaml
        kubeconfig: ${{ env.KUBECONFIG }}

    - name: Record and verify isolated KinD ownership
      run: |
        printf '%s\n' \
          "cluster=${KIND_CLUSTER_NAME}" \
          "context=${KUBE_CONTEXT}" \
          "kubeconfig=${KUBECONFIG}" \
          | install -m 600 /dev/stdin "${KUBECONFIG}.kuberic-owner"
        just verify-kind-context

    - name: Build and load Docker images
      run: just images

    - name: Install pinned Gateway API and Envoy Gateway
      run: just gateway-install

    - name: Run workspace tests
      run: cargo test --workspace --all-features

    - name: Collect Gateway diagnostics
      if: failure()
      timeout-minutes: 4
      run: just gateway-diagnostics > gateway-diagnostics.log 2>&1

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gateway-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: gateway-diagnostics.log
        if-no-files-found: ignore

  publish:
    name: Publish container images
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      with:
        build-warnings: ""

    - uses: taiki-e/install-action@cfb6a08e73d810c62150cc379cc3670921bec901 # protoc

    - name: Verify source ref is current
      run: |
        git fetch --force --no-tags origin "$GITHUB_REF"
        test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$(git rev-parse 'HEAD^{commit}')"

    - name: Build release binaries
      run: cargo build --locked --release -p kuberic-operator -p kvstore

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Generate kuberic-operator image metadata
      id: operator_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kuberic-operator
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Publish kuberic-operator image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: kuberic-operator/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.operator_meta.outputs.tags }}
        labels: ${{ steps.operator_meta.outputs.labels }}

    - name: Generate kvstore image metadata
      id: kvstore_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/kvstore
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=sha,format=long

    - name: Publish kvstore image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: examples/kvstore/deploy/Dockerfile
        build-args: BUILD_PROFILE=release
        platforms: linux/amd64
        push: true
        tags: ${{ steps.kvstore_meta.outputs.tags }}
        labels: ${{ steps.kvstore_meta.outputs.labels }}
