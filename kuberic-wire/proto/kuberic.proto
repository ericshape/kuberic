syntax = "proto3";

package kuberic.level.v1;

message Epoch {
  int64 data_loss_number = 1;
  int64 configuration_number = 2;
}

enum ReplicaRole {
  REPLICA_ROLE_UNKNOWN = 0;
  REPLICA_ROLE_PRIMARY = 1;
  REPLICA_ROLE_ACTIVE_SECONDARY = 2;
  REPLICA_ROLE_IDLE_SECONDARY = 3;
  REPLICA_ROLE_NONE = 4;
}

enum AccessStatus {
  ACCESS_STATUS_UNKNOWN = 0;
  ACCESS_STATUS_GRANTED = 1;
  ACCESS_STATUS_RECONFIGURATION_PENDING = 2;
  ACCESS_STATUS_NOT_PRIMARY = 3;
  ACCESS_STATUS_NO_WRITE_QUORUM = 4;
}

enum AgentStorageState {
  AGENT_STORAGE_STATE_UNKNOWN = 0;
  AGENT_STORAGE_STATE_UNINITIALIZED = 1;
  AGENT_STORAGE_STATE_INITIALIZED = 2;
  AGENT_STORAGE_STATE_UNSAFE = 3;
}

enum TransitionKind {
  TRANSITION_KIND_UNKNOWN = 0;
  TRANSITION_KIND_BOOTSTRAP = 1;
  TRANSITION_KIND_REPLACEMENT = 2;
  TRANSITION_KIND_FAILOVER = 3;
}

enum FaultType {
  FAULT_TYPE_UNKNOWN = 0;
  FAULT_TYPE_TRANSIENT = 1;
  FAULT_TYPE_PERMANENT = 2;
}

message LoadMetric {
  string name = 1;
  int64 value = 2;
}

message BuildStatus {
  string build_id = 1;
  ReplicaIdentity target = 2;
  uint64 last_sequence = 3;
  int64 durable_lsn = 4;
  bool completed = 5;
}

message ReplicaIdentity {
  int64 replica_id = 1;
  string instance_id = 2;
  string agent_generation = 3;
}

message ConfigurationMember {
  ReplicaIdentity identity = 1;
  ReplicaRole role = 2;
}

message Configuration {
  string configuration_id = 1;
  Epoch epoch = 2;
  int64 primary_id = 3;
  repeated ConfigurationMember members = 4;
  uint32 write_quorum = 5;
}

message EffectivePolicy {
  uint32 replica_set_size = 1;
  uint32 write_quorum = 2;
  uint32 read_quorum = 3;
  uint64 failover_delay_seconds = 4;
}

message GetAgentStatusRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  int64 replica_id = 3;
  string expected_instance_id = 4;
}

message AgentStatusReport {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  ReplicaIdentity identity = 3;
  string process_session_id = 4;
  uint64 report_sequence = 5;
  ReplicaRole role = 6;
  AccessStatus write_status = 7;
  Epoch epoch = 8;
  Configuration previous_configuration = 9;
  Configuration current_configuration = 10;
  int64 current_progress = 11;
  int64 committed_lsn = 12;
  optional int64 catch_up_capability = 13;
  AgentStorageState storage_state = 14;
  string pod_uid = 15;
  string pvc_uid = 16;
  string storage_error = 17;
  bool healthy = 18;
  int64 replica_id = 19;
  AccessStatus read_status = 20;
  int64 current_configuration_quorum_progress = 21;
  optional int64 catch_up_boundary = 22;
  bool catch_up_complete = 23;
  optional int64 deactivated_lsn = 24;
  repeated LoadMetric load_metrics = 25;
  FaultType reported_fault = 26;
  string pending_operation_id = 27;
  string retained_operation_id = 28;
  repeated BuildStatus builds = 29;
  Epoch deactivation_epoch = 30;
  optional int64 verified_replication_lsn = 31;
}

message InitializeAgentStoreCommand {
  string initialization_id = 1;
  string resource_uid = 2;
  int64 local_replica_id = 3;
  string expected_instance_id = 4;
  string expected_pod_uid = 5;
  string expected_pvc_uid = 6;
  string assigned_agent_generation = 7;
  EffectivePolicy effective_policy = 8;
  Configuration bootstrap_configuration = 9;
  ProvisioningIntent provisioning = 10;
}

message ProvisioningIntent {
  reserved 1, 2, 4, 5, 8, 9, 11;
  ReplicaIdentity replaces = 3;
  string pod_uid = 6;
  string pvc_uid = 7;
  string operation_id = 10;
}

enum BuildAuthorityKind {
  BUILD_AUTHORITY_KIND_UNSPECIFIED = 0;
  BUILD_AUTHORITY_KIND_BOOTSTRAP = 1;
  BUILD_AUTHORITY_KIND_PROVISIONING = 2;
  BUILD_AUTHORITY_KIND_FAILOVER = 3;
}

message BuildAuthority {
  string build_id = 1;
  BuildAuthorityKind kind = 2;
  ReplicaIdentity source = 3;
  ReplicaIdentity target = 4;
  Configuration current_configuration = 5;
  int64 replication_boundary_lsn = 6;
}

message EnsureConfigurationCommand {
  string operation_id = 1;
  Configuration previous_configuration = 2;
  Configuration current_configuration = 3;
  Epoch previous_epoch = 4;
  Epoch current_epoch = 5;
  EffectivePolicy effective_policy = 6;
  int64 local_replica_id = 7;
  string expected_instance_id = 8;
  string expected_agent_generation = 9;
  TransitionKind transition_kind = 10;
  bool grant_write = 11;
  bool current_only = 12;
  string retire_build_id = 13;
  AccessStatus primary_write_status = 14;
  repeated string retire_build_ids = 15;
  optional int64 failover_safe_lsn = 16;
}

message EnsureReplicaBuildCommand {
  string operation_id = 1;
  int64 local_replica_id = 2;
  string expected_instance_id = 3;
  string expected_agent_generation = 4;
  ReplicaIdentity target = 5;
  BuildAuthority authority = 6;
  string source_session_id = 7;
}

message ExecuteCommandRequest {
  uint32 protocol_version = 1;
  string resource_uid = 2;
  ReplicaIdentity target = 3;
  oneof command {
    InitializeAgentStoreCommand initialize_agent_store = 10;
    EnsureConfigurationCommand ensure_configuration = 11;
    EnsureReplicaBuildCommand ensure_replica_build = 12;
  }
}

message ExecuteCommandResponse {
  uint32 protocol_version = 1;
  AgentStatusReport observation = 2;
}

service AgentControl {
  rpc GetStatus(GetAgentStatusRequest) returns (AgentStatusReport);
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}

service ReplicaPeer {
  rpc GetStatus(GetAgentStatusRequest) returns (AgentStatusReport);
  rpc Execute(ExecuteCommandRequest) returns (ExecuteCommandResponse);
}
